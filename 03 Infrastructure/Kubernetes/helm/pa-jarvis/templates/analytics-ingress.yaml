apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.traefikIngress.entryPoint | quote }}
{{ if .Values.traefikIngress.tls.enabled }}
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: {{ .Values.traefikIngress.tls.certResolver | quote }}
{{ end }}
spec:
  ingressClassName: traefik
{{ if .Values.traefikIngress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.analytics.host | quote }}
{{ end }}
  rules:
    - host: {{ .Values.analytics.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: analytics
                port:
                  number: 8006
