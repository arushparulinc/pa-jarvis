apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: "{{ .Values.analytics.image.repository }}:{{ .Values.analytics.image.tag }}"
          imagePullPolicy: {{ .Values.analytics.image.pullPolicy }}
          env:
            - name: AK_DATA_DIR
              value: "/app/data"
          envFrom:
            - secretRef:
                name: storage-db-secrets
          volumeMounts:
            - name: shared-data
              mountPath: /app/data
          ports:
            - containerPort: 8006
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: shared-data
          hostPath:
            path: {{ required "sharedData.hostPath must be configured" .Values.sharedData.hostPath | quote }}
            type: DirectoryOrCreate
