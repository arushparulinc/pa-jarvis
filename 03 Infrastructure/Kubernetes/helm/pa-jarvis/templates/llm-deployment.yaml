apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      initContainers:
        - name: wait-for-storage
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - >-
              until wget -qO- http://storage:8004/health > /dev/null;
              do echo "Waiting for Storage service"; sleep 2; done
      containers:
        - name: llm
          image: "{{ .Values.llm.image.repository }}:{{ .Values.llm.image.tag }}"
          imagePullPolicy: {{ .Values.llm.image.pullPolicy }}

          ports:
            - containerPort: 8002

          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3

          env:
            - name: STORAGE_SERVICE_URL
              value: "http://storage:8004"
            - name: OLLAMA_HOST
              value: "http://192.168.0.30:11434"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: GEMINI_API_KEY
          envFrom:
            - secretRef:
                name: storage-db-secrets
