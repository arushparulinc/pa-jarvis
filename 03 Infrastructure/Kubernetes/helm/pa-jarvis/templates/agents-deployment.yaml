apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agents
  template:
    metadata:
      labels:
        app: agents
    spec:
      initContainers:
        - name: wait-for-llm
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - >-
              until wget -qO- http://llm:8002/health > /dev/null;
              do echo "Waiting for LLM service"; sleep 2; done
      containers:
        - name: agents
          image: "{{ .Values.agents.image.repository }}:{{ .Values.agents.image.tag }}"
          imagePullPolicy: {{ .Values.agents.image.pullPolicy }}
          ports:
            - containerPort: 8001
          env:
            - name: LLM_SERVICE_URL
              value: "http://llm:8002"
            - name: TOOLS_SERVICE_URL
              value: "http://tools:8003"
            - name: STORAGE_SERVICE_URL
              value: "http://storage:8004"
