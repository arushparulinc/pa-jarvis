apiVersion: apps/v1
kind: Deployment
metadata:
  name: scripts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scripts
  template:
    metadata:
      labels:
        app: scripts
    spec:
      containers:
        - name: scripts
          image: "{{ .Values.scripts.image.repository }}:{{ .Values.scripts.image.tag }}"
          imagePullPolicy: {{ .Values.scripts.image.pullPolicy }}
          env:
            - name: AK_GDRIVE_ROOT_FOLDER
              value: "1PZjK-JSCKraIUolTwTT2UDJAvCXCkZOB"
            - name: GDRIVE_ROOT_FOLDER_ID
              value: "1T-CohkkM-04O3ughMwDH9C3ZdTW2kH8H"
            - name: STORAGE_SERVICE_URL
              value: "http://storage:8004"
            - name: AK_DATA_DIR
              value: "/app/data"
          envFrom:
            - secretRef:
                name: storage-db-secrets
            - secretRef:
                name: google-oauth-secrets
          volumeMounts:
            - name: shared-data
              mountPath: /app/data
          ports:
            - containerPort: 8005
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: shared-data
          hostPath:
            path: {{ required "sharedData.hostPath must be configured" .Values.sharedData.hostPath | quote }}
            type: DirectoryOrCreate
