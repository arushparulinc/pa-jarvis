services:
  frontend:
    build:
      context: ./Frontend/njs_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    volumes:
      - ./nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    build:
      context: ./Backend/agent_router_fastpy
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/agent_router_fastpy/.env
    environment:
      MASTER_AGENT_URL: http://agents:8001
      STORAGE_SERVICE_URL: http://storage:8004
    depends_on:
      - agents
      - storage

  agents:
    build:
      context: ./Agents
    ports:
      - "8001:8001"
    env_file:
      - ./Agents/.env
    environment:
      LLM_SERVICE_URL: http://llm:8002
      TOOLS_SERVICE_URL: http://tools:8003
      STORAGE_SERVICE_URL: http://storage:8004
    depends_on:
      - llm
      - tools
      - storage

  llm:
    build:
      context: ./LLM
    ports:
      - "8002:8002"
    env_file:
      - ./LLM/.env
    environment:
      OLLAMA_HOST: http://192.168.0.30:11434
      STORAGE_SERVICE_URL: http://storage:8004
    depends_on:
      - storage

  tools:
    build:
      context: ./Tools
    ports:
      - "8003:8003"
    env_file:
      - ./Tools/.env
    environment:
      STORAGE_SERVICE_URL: http://storage:8004
    depends_on:
      - storage

  storage:
    build:
      context: ./Storage
    ports:
      - "8004:8004"
    env_file:
      - ./Storage/.env

  scripts:
    build:
      context: ../04 Scripts
    ports:
      - "8005:8005"
    env_file:
      - ../04 Scripts/.env
    volumes:
      - ${AK_DATA_HOST_DIR:-../../data}:/apinc/data
    depends_on:
      - storage

  analytics:
    build:
      context: ../05 Analytics/analytics_dashboard_fastpy
    ports:
      - "8006:8006"
    env_file:
      - ./Storage/.env
    depends_on:
      - storage

networks:
  default:
    name: pa-jarvis-dev
