name: pa-jarvis-scripts

services:
  scripts:
    build:
      context: .
    ports:
      - "8005:8005"
    env_file:
      - ../02 Source/.env
    environment:
      AK_DATA_DIR: /apinc/data
    volumes:
      - ${AK_DATA_HOST_DIR:-../../data}:/apinc/data
    networks:
      - pa-jarvis

networks:
  pa-jarvis:
    name: pa-jarvis-dev
    external: true
