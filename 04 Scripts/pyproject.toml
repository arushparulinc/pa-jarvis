[project]
name = "pa-jarvis-scripts"
version = "0.1.0"
description = "Scheduled and utility scripts service for PA Jarvis"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11,<4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.0",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "httpx>=0.28.1",
    "uvicorn>=0.51.0",
]

[tool.uv]
package = false
