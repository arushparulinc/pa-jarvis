name: Build and Push Dev Images

on:
  push:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: frontend
            context: "02 Source/Frontend/njs_frontend"
            image: pa-jarvis-frontend

          - service: backend
            context: "02 Source/Backend/fastpy_backend"
            image: pa-jarvis-backend

          - service: agents
            context: "02 Source/Agents"
            image: pa-jarvis-agents

          - service: llm
            context: "02 Source/LLM"
            image: pa-jarvis-llm

          - service: tools
            context: "02 Source/Tools"
            image: pa-jarvis-tools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:dev
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}

  update-dev-values:
    needs: build-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Update image tags
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          FILE="03 Infrastructure/Kubernetes/helm/pa-jarvis/values-dev.yaml"

          sed -i "s|tag: sha-[a-f0-9]*|tag: ${IMAGE_TAG}|g" "$FILE"

          echo "Updated image tags:"
          grep "tag:" "$FILE"

      - name: Commit and push image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "03 Infrastructure/Kubernetes/helm/pa-jarvis/values-dev.yaml"

          if git diff --cached --quiet; then
            echo "No image tag changes to commit."
            exit 0
          fi

          git commit -m "chore(dev): deploy sha-${{ github.sha }}"
          git push origin dev