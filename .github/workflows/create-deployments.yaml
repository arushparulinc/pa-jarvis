name: Create Deployment Branches

on:
  workflow_call:
    inputs:
      image_sha:
        description: Dev commit SHA used to build and tag the images
        required: true
        type: string

jobs:
  create-deployment:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - environment: dev
            deployment_branch: dev-deployment

          - environment: prd
            deployment_branch: prd-deployment

    steps:
      - name: Checkout built dev commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_sha }}
          fetch-depth: 0

      - name: Create ${{ matrix.deployment_branch }} from built dev commit
        run: |
          git checkout -B "${{ matrix.deployment_branch }}" "${{ inputs.image_sha }}"

      - name: Update image tags in both values files
        env:
          IMAGE_TAG: sha-${{ inputs.image_sha }}
        run: |
          values_files=(
            "03 Infrastructure/Kubernetes/helm/pa-jarvis/values-dev.yaml"
            "03 Infrastructure/Kubernetes/helm/pa-jarvis/values-prd.yaml"
          )

          for values_file in "${values_files[@]}"; do
            echo "Updating ${values_file} images to ${IMAGE_TAG}"
            sed -i "s|tag: sha-[a-f0-9]*|tag: ${IMAGE_TAG}|g" "$values_file"

            echo "Updated image tags in ${values_file}:"
            grep "tag:" "$values_file"
          done

      - name: Commit deployment change
        env:
          IMAGE_TAG: sha-${{ inputs.image_sha }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "03 Infrastructure/Kubernetes/helm/pa-jarvis/values-dev.yaml" \
            "03 Infrastructure/Kubernetes/helm/pa-jarvis/values-prd.yaml"

          if git diff --cached --quiet; then
            echo "No image tag changes required."
          else
            git commit -m "chore(${ENVIRONMENT}): deploy ${IMAGE_TAG}"
          fi

      - name: Push ${{ matrix.deployment_branch }}
        run: |
          git push --force origin "HEAD:${{ matrix.deployment_branch }}"
