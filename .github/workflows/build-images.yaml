name: Build and Push Images

on:
  push:
    branches:
      - dev

    # A deployment PR changes only Helm configuration.
    # We don't want that merge to rebuild all application images.
    paths-ignore:
      - "03 Infrastructure/Kubernetes/helm/**"

  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: frontend
            context: "02 Source/Frontend/njs_frontend"
            image: pa-jarvis-frontend

          - service: backend
            context: "02 Source/Backend/fastpy_backend"
            image: pa-jarvis-backend

          - service: agents
            context: "02 Source/Agents"
            image: pa-jarvis-agents

          - service: llm
            context: "02 Source/LLM"
            image: pa-jarvis-llm

          - service: tools
            context: "02 Source/Tools"
            image: pa-jarvis-tools

          - service: storage
            context: "02 Source/Storage"
            image: pa-jarvis-storage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}

  create-deployments:
    needs: build-images
    uses: ./.github/workflows/create-deployments.yaml
    with:
      image_sha: ${{ github.sha }}
